name: Metrics

on:
  schedule:
    - cron: "0 8 * * *"   # todos los días, 3:00 a.m. hora Colombia
  workflow_dispatch:       # para ejecutarlo a mano
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: WokerJJ
          template: classic
          filename: assets/metrics.svg
          committer_message: "chore(metrics): actualizar estadísticas de GitHub [skip ci]"
          config_timezone: America/Bogota
          base: header, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
